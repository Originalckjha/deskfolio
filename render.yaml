# Render Blueprint: DeskFolio as ONE free web service.
# The Express API also serves the built React app, so the whole site lives on one URL
# (https://<service-name>.onrender.com). The database is MongoDB Atlas (free M0).
#
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false`
# are asked for once in the dashboard and never stored in git.
services:
  - type: web
    name: deskfolio
    runtime: node
    plan: free # sleeps after ~15 min idle; the next visit then takes ~30-60 s to wake
    region: singapore # keep close to your Atlas cluster's region
    # Builds from the repo root so it can reach both client/ and server/.
    # --include=dev: the client build needs Vite, and NODE_ENV=production would skip it.
    buildCommand: >-
      npm ci --prefix client --include=dev &&
      npm run build --prefix client &&
      npm ci --prefix server --omit=dev &&
      npm run db:indexes --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Full Atlas connection string, with your password and /deskfolio before the "?"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # File uploads (PDF/PPT/images) also need CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY and
      # CLOUDINARY_API_SECRET. Add them later in the service's Environment tab; until then
      # notes and links work and uploads show "not configured".
      - key: CLOUDINARY_FOLDER
        value: deskfolio
      - key: MAX_UPLOAD_MB
        value: "15"
